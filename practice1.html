<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gridpractice.com</title>
    <style>
        .maincontainer{
            margin-top:10px;
            display:flex;
            flex-wrap:wrap;
            gap:10px 5px;
        }
        .firstcontainer{
            background-color:green;
            color:white;
        }
        .secondcontainer{
            background-color:skyblue;
            color:white;
        }
        .thirdcontainer{
            background-color:pink;
            color:grey;
        }
        .fourthcontainer{
            background-color:red;
            color:white;
        }
    </style>
</head>
<body>
    <div class="maincontainer">
        <div class="firstcontainer">this is first container.</div>
        <div class="secondcontainer">this is second container.</div>
        <div class="thirdcontainer">this is third container.</div>
        <div class="fourthcontainer">this is fourth container.</div>
    </div>
</body>
</html>
